<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <title>Movie Poster Grid</title>
</head>

<body>
  <!-- Dark/Light toggle -->
  <div class="dark-mode-toggle">
    <label id="darkModeLabel" for="darkModeSwitch">Dark Mode</label>
    <input type="checkbox" id="darkModeSwitch" onchange="toggleDarkMode()" />
  </div>

  <h1>Movie Posters</h1>

  <!-- Search -->
  <input type="text" id="searchBar" class="search-bar" placeholder="Search titles…" />

  <!-- Grid -->
  <div class="grid-container">
    {{ grid_items | safe }}
  </div>

  <!-- Floating Pagination -->
  <div id="pagination-controls" class="pagination" aria-label="Pagination controls">
    <button id="prevBtn" class="pager-btn" onclick="changePage(-1)" aria-label="Previous page">‹ Prev</button>
    <span id="page-number" aria-live="polite">1</span>
    <button id="nextBtn" class="pager-btn primary glow" onclick="changePage(1)" aria-label="Next page">Next ›</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden">
    <!-- Close button: red X, top-left -->
    <button id="closeLightbox" class="close-x" title="Close (Esc)">×</button>

    <img id="lightboxImage" src="" alt="Lightbox Image" />
  </div>

  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
