<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Raleway:wght@400;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Movie Poster Grid</title>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       TOP NAV
  ══════════════════════════════════════════════════════ -->
  <nav class="steam-nav">
    <div class="nav-brand">
      <svg class="nav-brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
        <line x1="7" y1="2" x2="7" y2="22"/>
        <line x1="17" y1="2" x2="17" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <line x1="2" y1="7" x2="7" y2="7"/>
        <line x1="2" y1="17" x2="7" y2="17"/>
        <line x1="17" y1="17" x2="22" y2="17"/>
        <line x1="17" y1="7" x2="22" y2="7"/>
      </svg>
      <span class="nav-brand-text">MOVIEDB</span>
    </div>

    <div class="nav-links">
      <a href="#library-section" class="nav-link">Library</a>
    </div>

    <button class="nav-recent-btn" id="recent-toggle-btn" onclick="toggleRecentDropdown()">
      Recently Added
      <svg class="nav-recent-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <span class="nav-count" id="total-count"></span>

    <div class="nav-filter-group" id="nav-filter-group">
      <button class="nav-filter-btn active" data-filter="all">All</button>
      <button class="nav-filter-btn" data-filter="watched">Watched</button>
      <button class="nav-filter-btn" data-filter="want_to_watch">Want to Watch</button>
      <button class="nav-filter-btn" data-filter="unwatched">Unwatched</button>
    </div>

    <div class="nav-size-control" title="Poster size">
      <button class="nav-size-btn" onclick="adjustCardSize(-10)" aria-label="Smaller posters">&#8722;</button>
      <input type="range" id="card-size-slider" class="nav-size-slider"
             min="100" max="300" step="5" value="160"
             oninput="setCardSize(this.value)" aria-label="Poster size" />
      <button class="nav-size-btn" onclick="adjustCardSize(10)" aria-label="Larger posters">&#43;</button>
    </div>

    <button class="nav-group-view-btn" id="group-view-btn" onclick="toggleGroupView()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Group View
    </button>

    <div class="nav-search">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchBar" class="search-input" placeholder="Search your library…" autocomplete="off" />
    </div>

    <div class="nav-actions">
      <button class="nav-upload-btn" onclick="openUploadModal()">+ Add Poster</button>
      <button class="nav-icon-btn theme-btn" onclick="toggleDarkMode()" title="Toggle theme" aria-label="Toggle dark/light mode">
        <!-- Moon: shown in dark mode, click to go light -->
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun: shown in light mode, click to go dark -->
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <!-- Hidden label kept because toggleDarkMode() and DOMContentLoaded both reference it -->
      <span id="darkModeLabel" class="sr-only">Dark Mode</span>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════
       RECENTLY ADDED DROPDOWN (toggled by nav button)
  ══════════════════════════════════════════════════════ -->
  <div class="recent-dropdown" id="recent-dropdown" aria-label="Recently added posters">
    <div class="recent-strip-wrap">
      <div class="recent-strip" id="recent-strip">
        <!-- Populated by JS when dropdown opens -->
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       MAIN LIBRARY GRID
  ══════════════════════════════════════════════════════ -->
  <section class="library-section" id="library-section">
    <div class="grid-container">
      {{ grid_items | safe }}
    </div>

    <!-- Pagination — inline bar, not floating -->
    <div id="pagination-controls" class="pagination-bar" aria-label="Pagination controls">
      <button id="prevBtn" class="page-btn" onclick="changePage(-1)" aria-label="Previous page">‹ Prev</button>
      <span id="page-number" class="page-num" aria-live="polite">1</span>
      <button id="nextBtn" class="page-btn primary" onclick="changePage(1)" aria-label="Next page">Next ›</button>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════
       UPLOAD MODAL
  ══════════════════════════════════════════════════════ -->
  <div id="upload-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Upload poster">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Upload New Poster</h2>
        <button class="modal-x" onclick="closeUploadModal()" aria-label="Close">×</button>
      </div>
      <form id="upload-form">
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="upload-file" accept=".jpg,.jpeg,.png,.webp" required />
          <svg class="drop-svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="drop-label">Drop image here or <span class="drop-browse">browse</span></span>
          <span class="drop-hint">jpg &middot; png &middot; webp</span>
          <span class="drop-filename" id="drop-filename"></span>
        </div>
        <div class="upload-fields">
          <label class="form-label">
            Movie / Show Title
            <input type="text" id="upload-title" placeholder="e.g. Inception" required />
          </label>
          <label class="form-label">
            Year <span class="form-hint">optional</span>
            <input type="text" id="upload-year" placeholder="e.g. 2010" maxlength="4" />
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-ghost" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn-steam-primary">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       LINK METADATA MODAL (compact, opened from grid card chain button)
  ══════════════════════════════════════════════════════ -->
  <div id="link-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Link metadata">
    <div class="link-modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Link Metadata</h2>
        <button class="modal-x" onclick="closeLinkModal()" aria-label="Close">×</button>
      </div>
      <div id="link-modal-body"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       LIGHTBOX
       Structure: image left | sidebar right (close btn + metadata injected by JS)
  ══════════════════════════════════════════════════════ -->
  <div id="lightbox" aria-modal="true" role="dialog" aria-label="Poster detail">
    <div class="lb-dialog">
      <!-- lb-image-wrap: blurred background set by JS; sharp poster on top -->
      <div class="lb-image-wrap" id="lb-image-wrap">
        <img id="lightboxImage" src="" alt="Poster" />
      </div>
      <div class="lb-sidebar">
        <!-- close-x id + class kept exactly — JS wires click and inserts #metadata afterend -->
        <button id="closeLightbox" class="close-x" title="Close (Esc)" aria-label="Close">×</button>
        <button id="lb-gear-btn" class="lb-gear-btn" title="Customize appearance" aria-label="Customize appearance" onclick="_toggleCustomPanel()">&#9881;</button>
        <!-- #lb-custom-panel is injected here by _toggleCustomPanel() -->
        <!-- #metadata div is injected here by openLightbox() -->
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
